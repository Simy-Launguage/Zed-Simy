name: Release

# Publishing flow for the Zed extension:
#   1. Bump `version` in `extension.toml`.
#   2. Commit and push to `main`.
#   3. Push a version tag: `git tag v0.0.2 && git push origin v0.0.2`.
#   4. This workflow opens a PR against `zed-industries/extensions` (via your fork)
#      that bumps the registry entry to this tag.
#
# Prerequisites (one-time):
#   - Fork https://github.com/zed-industries/extensions to <owner>/extensions.
#   - Add a repository secret `COMMITTER_TOKEN`: a PAT with `repo` and `workflow` scopes.

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    name: Release Zed Extension
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Bump Zed extension
        uses: huacnlee/zed-extension-action@v2
        with:
          extension-name: simy
          push-to: Neutriny/extensions
        env:
          COMMITTER_TOKEN: ${{ secrets.COMMITTER_TOKEN }}
